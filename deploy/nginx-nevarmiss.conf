# /etc/nginx/sites-available/nevarmiss.com
# certbot --nginx adds the HTTPS (443) block and the redirect on first run.
server {
    listen 80;
    listen [::]:80;
    server_name nevarmiss.com www.nevarmiss.com;

    # Live story stream: one long-lived connection per browser.
    # Buffering would hold stories back and deliver them in batches.
    location = /api/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
