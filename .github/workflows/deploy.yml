# On every push to main: test, build, copy to the VPS, restart.
# Needs repo secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (see deploy/README.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          cd server && go vet ./... && go test ./...
          cd ../web && npm ci && npm run typecheck

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Build
        run: |
          case "$(ssh vps uname -m)" in
            x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported VPS architecture"; exit 1 ;;
          esac
          (cd web && npm run build)
          mkdir -p release
          (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath -ldflags="-s -w" -o ../release/nuevo ./cmd/nuevo)
          cp -R web/dist release/web
          cp server/feeds.json release/
          tar -czf release.tgz -C release .

      - name: Deploy
        run: |
          scp release.tgz vps:/tmp/nuevo-release.tgz
          ssh vps 'set -e
            cd /opt/nuevo
            rm -rf next && mkdir next && tar -xzf /tmp/nuevo-release.tgz -C next
            rm -rf web && mv next/web web
            mv next/nuevo nuevo && mv next/feeds.json feeds.json
            rm -rf next /tmp/nuevo-release.tgz
            sudo /usr/bin/systemctl restart nuevo'

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if ssh vps curl -fsS http://127.0.0.1:4000/api/health; then exit 0; fi
            sleep 2
          done
          echo "app did not come up; check: journalctl -u nuevo -n 50"
          exit 1
